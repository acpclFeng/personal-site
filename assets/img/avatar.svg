<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e27"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#halo)"/>

  <!-- 网格 -->
  <g stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/><line x1="0" y1="400" x2="400" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
  </g>

  <!-- 人像抽象 -->
  <g>
    <circle cx="200" cy="190" r="78" fill="none" stroke="url(#sg)" stroke-width="3"/>
    <path d="M120 360 Q200 250 280 360 L280 500 L120 500 Z" fill="url(#sg)" fill-opacity="0.25"/>
    <circle cx="200" cy="190" r="60" fill="#050816" fill-opacity="0.6"/>
    <path d="M170 185 h20 M210 185 h20" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 215 Q200 228 220 215" stroke="#ff2bd6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <text x="200" y="455" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="20" font-weight="700" fill="#e7f0ff" letter-spacing="3">NOVA</text>
</svg>
