<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="绩点截图占位 1">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e27"/>
      <stop offset="1" stop-color="#151a3f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(0,240,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="20" y="20" width="760" height="460" rx="14" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <text x="400" y="225" text-anchor="middle" font-family="Orbitron, Rajdhani, system-ui, sans-serif" font-size="34" font-weight="900" fill="url(#g)">在此放入绩点截图 ①</text>
  <text x="400" y="270" text-anchor="middle" font-family="Rajdhani, system-ui, sans-serif" font-size="18" fill="#8aa0c8">导出为 gpa-1.png 后替换本文件，并在 data.js 的 academics 里改 src</text>
  <text x="400" y="300" text-anchor="middle" font-family="Rajdhani, system-ui, sans-serif" font-size="14" fill="#5d6f95">（建议 800×500 左右，透明背景或深色背景都行）</text>
</svg>
